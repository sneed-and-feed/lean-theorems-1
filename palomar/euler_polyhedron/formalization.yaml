version: "v0.4"

project:
  name: "Combinatorial Map Parity, Face-Degree Handshaking Bounds & Combinatorial Genus Invariants"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Tutte–Edmonds combinatorial map invariants,
    face-degree handshaking inequalities, and planar edge bounds across two carrier frameworks:
    (1) Tutte–Edmonds Combinatorial Maps (dart rotation systems on finite sets with edge involution
    alpha and vertex permutation sigma), proving the universal even parity of the Euler characteristic
    chi(M) via the permutation signature homomorphism, the face-cycle handshaking inequality k * F <= 2E
    derived from absence of monogons and face degree >= k, planar edge bounds E <= 3V - 6 and E <= 2V - 4
    derived conditionally under the hypothesis chi(M) = 2, average degree bound 2E < 6V, combinatorial
    parameter obstructions for K5 (V=5, E=10, chi <= 0, genus >= 1) and K3,3 (V=6, E=9, chi <= 0, genus >= 1),
    and a concrete toroidal embedding certificate on 20 darts with chi = 0 and genus = 1;
    (2) SimpleGraph Trees, formulating Euler's tree relation V - E + 1 = 2 by wrapping Mathlib's
    pre-existing SimpleGraph.IsTree.card_edgeFinset theorem.
    Continuous surface embeddings and topological realizations of genus are outside the formal scope.

classification:
  arxiv: [math.CO]
  msc2020: ["05C10", "52B05", "57M15"]

