    type: paper
    year: 1813
    venue: "Journal de l'École Polytechnique"
    authors:
      - "Augustin-Louis Cauchy"
    relationship: formalizes
  - title: "A combinatorial representation for polyhedral surfaces"
    type: paper
    year: 1960
    venue: "Notices of the American Mathematical Society"
    authors:
      - "Jack Edmonds"
    relationship: formalizes
  - title: "A census of planar maps"
    type: paper
    year: 1962
    venue: "Canadian Journal of Mathematics"
    doi: "https://doi.org/10.4153/CJM-1962-002-9"
    authors:
      - "W. T. Tutte"
    relationship: adapts
    note: >-
      Formalization formalizes Tutte's combinatorial map rotation system framework for 2-cell surface embeddings.
  - title: "Über das Problem der Nachbargebiete"
    type: paper
    year: 1891
    venue: "Mathematische Annalen"
    doi: "https://doi.org/10.1007/BF01199276"
    authors:
