version: "v0.4"

project:
  name: "Euler's Polyhedron Formula & Planar Map Invariants"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Euler's Polyhedron Formula V - E + F = 2
    (1758, Wiedijk #13) and fundamental planar map invariants across two rigorous mathematical
    carrier frameworks:
    (1) Tutte–Edmonds Combinatorial Maps (dart rotation systems on finite sets with edge involution
    alpha and vertex permutation sigma), proving the universal even parity of the Euler characteristic
    chi(M) via the permutation signature homomorphism, classical planar edge bounds E <= 3V - 6 and
    E <= 2V - 4, average degree bound 2E < 6V, authentic non-planarity obstructions for K5 and K3,3,
    and concrete machine-checked regular polyhedra (tetrahedron, triangle, square);
    (2) SimpleGraph Trees (Euler 1758, Cauchy 1813), proving Euler's formula for trees V - E + 1 = 2
    on genuine SimpleGraph carriers.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C10", "52B05", "05C38"]

sources:
  - title: "Elementa doctrinae solidorum"
    type: paper
    authors:
      - "Leonhard Euler"
    relationship: inspired_by
  - title: "Recherches sur les polyedres"
    type: paper
    authors:
      - "A.-L. Cauchy"
    relationship: formalizes
  - title: "A combinatorial condition for planar graphs"
    type: paper
    authors:
      - "Saunders Mac Lane"
    relationship: adapts
    note: >-
      Formalization adapts Mac Lane's 2-basis cycle space planarity criterion for combinatorial planar graphs.
  - title: "A census of planar maps"
    type: paper
    authors:
      - "W. T. Tutte"
    relationship: adapts
    note: >-
      Formalization adapts Mac Lane's 2-basis cycle space planarity criterion for combinatorial planar graphs.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Combinatorics/SimpleGraph/Acyclic.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's graph theory and permutation cycle type libraries
      (SimpleGraph.IsTree, Equiv.Perm.cycleType, Equiv.Perm.sign) to establish combinatorial map
      Euler characteristics, signature parity invariants, and tree Euler formulas.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
