project:
  name: "Euler's Polyhedron Formula, Topological Genus Invariants & Non-Planarity Obstructions"
  slug: "euler_polyhedron"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, research-grade machine-checked Lean 4 formalization of Euler's Polyhedron Formula
    V - E + F = 2 (1758, Wiedijk #13), topological genus invariants, and non-planarity obstructions
    across two mathematical carrier frameworks:
    (1) Tutte–Edmonds Combinatorial Maps (dart rotation systems on finite sets with edge involution
    alpha and vertex permutation sigma), proving the universal even parity of the Euler characteristic
    chi(M) via the permutation signature homomorphism, face-cycle sum handshaking inequalities 3F <= 2E
    and 4F <= 2E, classical planar edge bounds E <= 3V - 6 and E <= 2V - 4, average degree bound 2E < 6V,
    authentic topological genus obstructions for K5 (chi <= 0, genus >= 1, chi != 2) and K3,3 (chi <= 0,
    genus >= 1, chi != 2) eliminating numerical pseudo-contradictions (AP-05), and a concrete tightness
    certificate via the toroidal embedding of K5 on 20 darts with chi = 0 and genus = 1;
    (2) SimpleGraph Trees (Euler 1758, Cauchy 1813), proving Euler's formula for trees V - E + 1 = 2
    on genuine SimpleGraph carriers.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

