version: "v0.4"

project:
  name: "The Happy Ending Theorem (Erdős–Szekeres Convex Polygon Theorem, 1935)"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A comprehensive, machine-checked Lean 4 formalization of the Erdős–Szekeres Convex Polygon Theorem (1935).
        Formalizes orientation determinants, general position, x-coordinate sorting, cup-cap sequences with
        Pascal-type binomial split recurrences, halfspace separation for convex hulls, and proves that any set
        of at least choose(2k - 4, k - 2) + 1 points in general position contains a convex k-gon,
        34.0-rc1). verifying the Happy Ending Problem.
        To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification::
  arxiv: [math.CO, math.MG]
  msc2020: ["52C10", "05D10", "52A10"]

sources:
  - title: "A combinatorial problem in geometry"
    type: paper
    authors:
      - "Paul Erdős"
      - "George Szekeres"
    relationship: formalizes
  - title: "Problem 1835"
    type: paper
    authors:
      - "Esther Klein"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.