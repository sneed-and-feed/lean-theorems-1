version: "v0.4"

project:
  name: "The Happy Ending Theorem (Erdős–Szekeres Convex Polygon Theorem, 1935)"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A comprehensive, machine-checked Lean 4 formalization of the Erdős–Szekeres Convex Polygon Theorem (1935).
    Formalizes orientation determinants, general position, 2D rotation transformations with finite slope avoidance
    (rotating any finite set to have mutually distinct x-coordinates), x-coordinate sorting, cup-cap sequences with
    Pascal-type binomial split recurrences, halfspace separation for convex hulls, and rotation invariance of convex
    polygons. Proves that any finite set of at least choose(2k - 4, k - 2) + 1 points in general position in ℝ²
    contains the vertices of a strictly convex k-gon, verifying the Happy Ending Theorem under pure general position
    with no distinct-x-coordinate restriction. To the maintainers' knowledge, the theorem was not found in an exact
    declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["52C10", "05D10", "52A10"]

sources:
  - title: "A combinatorial problem in geometry"
    type: paper
    authors:
      - "Paul Erdős"
      - "George Szekeres"
    year: 1935
    venue: "Compositio Mathematica, Vol. 2, pp. 463-470"
    relationship: formalizes
  - title: "Problem 1835"
    type: paper
    authors:
      - "Esther Klein"
    year: 1935
    venue: "Középiskolai Matematikai Lapok"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
