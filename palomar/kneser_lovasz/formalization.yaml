version: "v0.4"

project:
  name: "Kneser's Graph Coloring Upper Bound"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Kneser's explicit graph coloring upper bound
    (Kneser, 1955). Formalizes the Kneser graph KG(n, k) on k-subsets of an n-element set, defines
    Kneser's combinatorial fiber coloring based on minimal elements, proves proper vertex coloring via
    fiberwise pigeonhole on intervals, and establishes that chi(KG(n, k)) <= n - 2k + 2. Distinguishes
    Kneser's constructive coloring upper bound from Lovász's (1978) topological lower bound based on
    Borsuk-Ulam / homotopy theory. To the maintainers' knowledge, the theorem was not found in an exact
    declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C15", "05D05"]

sources:
  - title: "Aufgabe 360"
    type: paper
    year: 1955
    venue: "Jahresbericht der Deutschen Mathematiker-Vereinigung"
    authors:
      - "Martin Kneser"
    relationship: formalizes
  - title: "Kneser's conjecture, chromatic number, and homotopy"
    type: paper
    year: 1978
    venue: "Journal of Combinatorial Theory, Series A"
    authors:
      - "László Lovász"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    maintainer audit with 0 errors, 0 sorries, and strictly standard kernel axioms.
