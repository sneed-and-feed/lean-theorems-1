version: "v0.4"

project:
  name: "The Frankl–Wilson Theorem on Modulo-p Intersecting Set Families"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of the Frankl–Wilson theorem (1981)
    for modulo-p intersecting set families. Uses the polynomial linear algebra method
    over ZMod p to prove both the general non-uniform bound |F| <= sum_{i=0}^s choose(n, i)
    and the uniform cardinality bound |F| <= choose(n, s).
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05D05", "11B75", "15A03"]

sources:
  - title: "Intersection theorems with geometric consequences"
    type: paper
    year: 1981
    venue: "Combinatorica"
    authors:
      - "P. Frankl"
      - "R. M. Wilson"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.