version: "v0.4"

project:
  name: "General n-Dimensional Sperner's Lemma and Fixed-Point Combinatorics"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of the general n-dimensional combinatorial Sperner parity theorem
    on abstract n-dimensional pseudomanifolds with boundary for arbitrary dimension n : ℕ. Proves the local
    door-counting parity invariant on (n+1)-simplices, the global double-counting identity on door-facet
    incidences, and the master parity congruence modulo 2 relating panchromatic (n+1)-simplices to boundary
    doors. The theorem is conditional on an odd number of boundary (n-1)-doors; obtaining the classical
    geometric Sperner lemma for simplicial subdivisions of geometric simplices with boundary-preserving colorings
    is a specialization requiring an additional geometric boundary induction argument not contained in these
    abstract combinatorial declarations. This n-dimensional development (SpernerND.lean) generalizes and
    supersedes the fixed-dimensional combinatorial parity identities in the repository's lower-dimensional
    modules (SpernersLemma.lean and Sperner3D.lean) into a single unified parameterized architecture. To the
    maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type
    signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.AT]
  msc2020: ["05E45", "57Q05", "52A35", "55M20"]

sources:
  - title: "Neuer Beweis für die Invarianz der Dimensionszahl und des Gebietes"
    type: paper
    authors:
      - "Emanuel Sperner"
    year: 1928
    venue: "Abhandlungen aus dem Mathematischen Seminar der Universität Hamburg"
    volume: "6"
    issue: "1"
    pages: "265-272"
    relationship: adapts
    note: >-
      Formalization adapts Sperner's boundary door-parity induction to general n-dimensional simplicial
      pseudomanifolds.
  - title: "Simplicial Approximation of Fixed Points"
    type: paper
    authors:
      - "Harold W. Kuhn"
    year: 1968
    venue: "Proceedings of the National Academy of Sciences"
    volume: "61"
    issue: "4"
    pages: "1238-1242"
    relationship: adapts
    note: >-
      Formalization adapts Kuhn's labeled cubical triangulation and constructive combinatorial path-following
      algorithms.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms. This module generalizes
    and supersedes the fixed 2D edge-pseudomanifold and 3D face-pseudomanifold parity formalizations
    in SpernersLemma.lean and Sperner3D.lean.
