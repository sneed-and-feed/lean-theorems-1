version: "v0.4"

project:
  name: "Székely's Algebraic Expectation Amplification Lemma for Graph Crossings"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Székely's Algebraic Expectation Amplification Lemma
    (László Székely, 1997) for the Crossing Lemma (Ajtai, Chvátal, Newborn, Szemerédi 1982; Leighton 1983)
    and its application to the Szemerédi–Trotter point-line incidence theorem. Formalizes the algebraic
    probability expectation inequality step that amplifies the planar Euler base condition (cr >= e - 3v)
    under independent vertex sub-sampling to deduce the tight crossing lower bound cr >= e^3 / (64 v^2)
    for dense graphs (e >= 4v). To the maintainers' knowledge, the theorem was not found in an exact
    declaration name, docstring, and type signature search of the pinned Mathlib revision
    (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["05C10", "05C62", "52C10"]

sources:
  - title: "Crossing-free subgraphs"
    type: paper
    authors:
      - "Miklós Ajtai"
      - "Vašek Chvátal"
      - "Monty M. Newborn"
      - "Endre Szemerédi"
    relationship: formalizes
  - title: "Crossing numbers and hard Erdős problems in discrete geometry"
    type: paper
    authors:
      - "László A. Székely"
    relationship: adapts
    note: >-
      Formalization adapts Székely's probabilistic crossing lemma and incidence counting techniques to bound
      graph edge crossings and point-line incidences.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Data/Real/Basic.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's real arithmetic and order inequality tactics
      to establish Székely's polynomial expectation identity and crossing number lower bounds.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
