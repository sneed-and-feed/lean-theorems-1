version: "v0.4"

project:
  name: "Pick's Theorem on Lattice Polygons (Wiedijk #92)"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Pick's Theorem (Georg Alexander Pick, 1899;
        Freek Wiedijk 100 Theorems #92). Formalizes elementary lattice triangulations of planar polygons,
        Euler's disk characteristic V - E + F = 1, edge-face incidence double counting 3F = 2E_int + E_bd,
        boundary gluing valuation additivity, and proves both the real formula Area = i + b/2 - 1 and the
        34.0-rc1). discrete formula 2*Area = 2*i + b - 2.
        To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification::
  arxiv: [math.CO, math.MG]
  msc2020: ["52C05", "05C10", "11H06"]

sources:
  - title: "Geometrisches zur Zahlenlehre"
    type: paper
    authors:
      - "Georg Alexander Pick"
    relationship: formalizes
  - title: "Mathematical Snapshots"
    type: book
    authors:
      - "Hugo Steinhaus"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.