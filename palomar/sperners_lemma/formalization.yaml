version: "v0.4"

project:
  name: "Sperner's Lemma in 1D and 2D"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Sperner's Lemma (1928) in 1D and 2D.
    Proves the 1D color-switch parity theorem along paths and the 2D simplicial parity theorem
    on triangulations with boundary via double-counting of panchromatic triangles and boundary doors.
    Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.AT]
  msc2020: ["05E45", "55M20", "57Q05"]

sources:
  - title: "Neuer Beweis für die Invarianz der Dimensionszahl und des Gebietes"
    type: paper
    authors:
      - "Emanuel Sperner"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the maintainers
    with interactive proof assistance and refactoring. Verified with 0 errors, 0 warnings, 0 sorries,
    and 0 custom axioms.
