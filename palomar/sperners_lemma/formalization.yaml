version: "v0.4"

project:
  name: "Sperner's Lemma & Simplicial Fixed-Point Combinatorics in 1D, 2D, and 3D"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Emanuel Sperner's foundational 1928 lemma
    and combinatorial parity theorems across dimensions 1, 2, and 3 (Wiedijk #57). Formalizes:
    (1) 1D Sperner Lemma: path color-switching parity theorem and existence of bicolored segments;
    (2) 2D Sperner Lemma: simplicial door-counting on abstract edge-pseudomanifolds with boundary
    (every edge in 1 or 2 triangles), deriving the global parity identity |T_pan| = |E_bd^01| (mod 2),
    oddness transfer, and panchromatic triangle existence;
    (3) 3D Sperner Lemma: tetrahedral face-pseudomanifold door double-counting, exhaustive 256-state
    local parity evaluation, 3D parity invariant, and trichromatic door-to-panchromatic tetrahedron existence.
    Clarifies the exact pseudomanifold generality of Sperner's combinatorial lemma without requiring
    topological manifold vertex-link disk conditions.

    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.AT]
  msc2020: ["05E45", "55M20", "57Q05", "52B05"]

sources:
  - title: "Neuer Beweis für die Invarianz der Dimensionszahl und des Gebietes"
    type: paper
    authors:
      - "Emanuel Sperner"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes across 1D, 2D, and 3D dimensions.
    Solution verified through maintainer audit with 0 errors, 0 sorries, and strictly
    standard kernel axioms (propext, Quot.sound, Classical.choice).
