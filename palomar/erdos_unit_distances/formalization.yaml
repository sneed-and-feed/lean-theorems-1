version: "v0.4"

project:
  name: "Spencer–Szemerédi–Trotter Bound on the Erdős Unit Distance Problem"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of the Spencer–Szemerédi–Trotter (1984)
    upper bound u(n) = O(n^(4/3)) on the Erdős unit distance problem in the Euclidean plane,
    using László Székely's circle crossing lemma approach (1997). Proves explicit non-asymptotic
    bounds u(n) <= 2 n^(4/3) + 4n, u(n) <= 4 n^(4/3) for n >= 8, and the asymptotic constant existence.
    Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["52C10", "05C10", "05C62"]

sources:
  - title: "Unit distances in the Euclidean plane"
    type: paper
    authors:
      - "Joel Spencer"
      - "Endre Szemerédi"
      - "William T. Trotter"
    relationship: formalizes
  - title: "On Sets of Distances of n Points"
    type: paper
    authors:
      - "Paul Erdős"
    relationship: background
  - title: "Crossing numbers and hard Erdős problems in discrete geometry"
    type: paper
    authors:
      - "László A. Székely"
    relationship: adapts

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
