version: "v0.4"

project:
  name: "Radon's Lemma and Helly's Theorem on Convex Sets"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Radon's Lemma (Johann Radon, 1921)
    and Helly's Theorem on intersecting families of convex sets (Eduard Helly, 1923; Freek
    Wiedijk #99) from first principles. Proves that any d + 2 points in ℝ^d admit a Radon
    partition into two disjoint subsets whose convex hulls intersect, and uses Radon's lemma
    by induction on the family size to prove Helly's theorem for finite families of convex sets
    under the general <= d + 1 subfamily intersection hypothesis (covering small families |ι| <= d + 1 as well as large families).
    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

