version: "v0.4"

project:
  name: "The Sylvester–Gallai Theorem on Ordinary Lines in the Euclidean Plane"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Sylvester–Gallai theorem (J. J.
    Sylvester 1893, T. Gallai 1944, L. M. Kelly 1948; Freek Wiedijk #98). Proves that every
    finite non-collinear set of points in the real Euclidean plane contains an ordinary line
    passing through exactly two points of the set, formalized via Kelly's minimal point-line distance argument.

    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
        docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).
classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52C10", "52C35", "51M04"]

sources:
  - title: "Mathematical Question 11851"
    type: paper
    authors:
      - "J. J. Sylvester"
    relationship: formalizes
  - title: "Solution to Problem 4065"
    type: paper
    authors:
      - "Tibor Gallai"
    relationship: formalizes
  - title: "A problem of collinear points"
    type: paper
    authors:
      - "H. S. M. Coxeter"
      - "L. M. Kelly"
    relationship: adapts
    note: >-
      Formalization adapts Kelly's Euclidean distance-minimization proof (via Coxeter) to establish the
      existence of an ordinary line in non-collinear point configurations.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
