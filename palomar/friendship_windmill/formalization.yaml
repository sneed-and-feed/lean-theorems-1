version: "v0.4"

project:
  name: "The Friendship Windmill Structure Theorem (Erdős–Rényi–Sós 1966)"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Friendship Windmill Structure Theorem
    (Erdős, Rényi, and Sós, 1966). Proves that any finite graph in which every pair of distinct vertices
    shares exactly one common neighbor possesses a universal vertex w, has an odd number of vertices |V| = 2k + 1,
    induces a 1-regular perfect matching on V \ {w}, and is isomorphic to the Dutch windmill graph Wd(k, 2)
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C75", "05C50", "05C07"]

sources:
  - title: "On a problem of graph theory"
    type: paper
    authors:
      - "Paul Erdős"
      - "Alfréd Rényi"
      - "Vera T. Sós"
    relationship: formalizes
  - title: "Proofs from THE BOOK"
    type: book
    authors:
      - "Martin Aigner"
      - "Günter M. Ziegler"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Combinatorics/SimpleGraph/Finite.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's simple graph theory library and finite graph neighborhood infrastructure
      (SimpleGraph.neighborFinset, SimpleGraph.degree) to construct and prove the windmill graph decomposition.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
