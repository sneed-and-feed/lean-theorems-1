version: "v0.4"

project:
  name: "Beck's Theorem on Point Configurations and Incidence Geometry"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of fundamental incidence geometry results on point
    configurations in the Euclidean plane R^2 from József Beck's work (1983). Establishes the exact
    pairs double-counting identity sum_{l in L(P)} |l|(|l| - 1) = |P|(|P| - 1), deduces the fundamental
    pair-counting bound |P|(|P| - 1) <= |L(P)| * k(k - 1) (where k is the maximum number of collinear points),
    and proves the parameterized algebraic dichotomy for any threshold parameter alpha in (0, 1).
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring,
    and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["52C10", "52C30", "05B25"]

sources:
  - title: "On the lattice property of the plane and some problems of Dirac, Motzkin and Erdős in combinatorial geometry"
    type: paper
    year: 1983
    venue: "Combinatorica"
    authors:
      - "József Beck"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
