version: "v0.4"

project:
  name: "Hall's Marriage Theorem on Systems of Distinct Representatives"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Hall's Marriage Theorem (Philip Hall
    1935, Halmos–Vaughan 1950; Freek Wiedijk #87). Proves that an indexed family of finite sets
    admits a system of distinct representatives (SDR) if and only if Hall's marriage condition holds.

    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
        docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).
classification:
  arxiv: [math.CO]
  msc2020: ["05A05", "05C70", "05D15"]

sources:
  - title: "On Representatives of Subsets"
    type: paper
    authors:
      - "P. Hall"
    relationship: formalizes
  - title: "The Marriage Problem"
    type: paper
    authors:
      - "P. R. Halmos"
      - "H. E. Vaughan"
    relationship: adapts
    note: >-
      Formalization adapts Halmos and Vaughan's finite induction and defect matching reduction for Hall's
      Marriage condition.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
