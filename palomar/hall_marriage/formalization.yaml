version: "v0.4"

project:
  name: "Hall's Marriage Theorem on Systems of Distinct Representatives"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Hall's Marriage Theorem (Philip Hall
    1935, Halmos–Vaughan 1950; Freek Wiedijk #87). Proves that an indexed family of finite sets
    admits a system of distinct representatives (SDR) if and only if Hall's marriage condition
    holds for all index subsets. Verified absent from core Mathlib (checked against Mathlib
    v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05A05", "05C70", "05D15"]

sources:
  - title: "On Representatives of Subsets"
    type: paper
    authors:
      - "P. Hall"
    relationship: formalizes
  - title: "The Marriage Problem"
    type: paper
    authors:
      - "P. R. Halmos"
      - "H. E. Vaughan"
    relationship: adapts

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the
    maintainers with interactive proof assistance and refactoring. Verified with 0 errors,
    0 warnings, 0 sorries, and 0 custom axioms.
