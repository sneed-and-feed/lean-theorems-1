version: "v0.4"

project:
  name: "Elekes's Sum-Product Inequality in Additive Combinatorics"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of György Elekes's landmark sum-product
    inequalities (1997) via incidence geometry and the Szemerédi–Trotter theorem.
    Proves the max sum-product bound max(|A + A|, |A * A|) >= 1/4 |A|^(5/4), the product-sum
    bound |A + A| * |A * A| >= 1/16 |A|^(5/2), and structural additive-multiplicative expansion bounds.
    Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.NT]
  msc2020: ["11B75", "05D99", "52C10"]

sources:
  - title: "On the number of sums and products"
    type: paper
    authors:
      - "György Elekes"
    relationship: formalizes
  - title: "On sums and products of integers"
    type: paper
    authors:
      - "Paul Erdős"
      - "Endre Szemerédi"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
