version: "v0.4"

project:
  name: "Elekes's Sum-Product Inequality in Additive Combinatorics"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of György Elekes's landmark sum-product
    inequalities (1997) via incidence geometry and the Szemerédi–Trotter theorem.
    Defines the ElekesConfiguration structure as an incidence reduction interface connecting
    point-line crossing bounds to explicit sum-product expansion. Proves the max sum-product
    bound max(|A + A|, |A * A|) >= 1/4 |A|^(5/4), the product-sum bound |A + A| * |A * A| >= 1/16 |A|^(5/2),
    and reciprocal additive-multiplicative growth theorems (|A+A| <= K|A| => |A*A| >= 1/(16K)|A|^(3/2)
    and |A*A| <= K|A| => |A+A| >= 1/(16K)|A|^(3/2)). To the maintainers' knowledge, the theorem was
    not found in an exact declaration name, docstring, and type signature search of the pinned
    Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.NT]
  msc2020: ["11B75", "05D99", "52C10"]

sources:
  - title: "On the number of sums and products"
    type: paper
    authors:
      - "György Elekes"
    relationship: formalizes
  - title: "On sums and products of integers"
    type: paper
    authors:
      - "Paul Erdős"
      - "Endre Szemerédi"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Analysis/SpecialFunctions/Pow/Real.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's real power functions (rpow) and order tactics
      to establish Elekes's algebraic point-line incidence reductions and sum-product exponent bounds.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
