version: "v0.4"

project:
  name: "Fisk's Triangulation Guard Partition Lemma from 3-Colorings"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Fisk's Triangulation Guard Partition Lemma
    (Steve Fisk, 1978), the combinatorial partition and pigeonhole core of Fisk's proof of Chvátal's
    Art Gallery Theorem (1975). Proves that for any graph on n vertices equipped with a valid proper
    3-coloring (such as a 3-colored planar polygon triangulation), selecting the minimal color class yields
    a guard set of size at most floor(n / 3) covering all 3-cliques / facial triangles. The existence of a
    polygon triangulation and its 3-colorability serve as external preconditions, isolating the exact
    discrete guard partition mechanism. To the maintainers' knowledge, the theorem was not found in an
    exact declaration name, docstring, and type signature search of the pinned Mathlib revision
    (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["05C15", "05C10", "52C99"]

sources:
  - title: "A combinatorial theorem in plane geometry"
    type: paper
    authors:
      - "Václav Chvátal"
    relationship: formalizes
  - title: "A short proof of Chvátal's watchman theorem"
    type: paper
    authors:
      - "Steve Fisk"
    relationship: adapts
    note: >-
      Formalization adapts Fisk's 3-coloring triangulation partitioning argument to select a minimal guard
      vertex set of size at most floor(n / 3).
  - title: "Art Gallery Theorems and Algorithms"
    type: book
    authors:
      - "Joseph O'Rourke"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
