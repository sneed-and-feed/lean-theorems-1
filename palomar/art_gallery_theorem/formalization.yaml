version: "v0.4"

project:
  name: "Chvátal's Art Gallery Theorem & Fisk's 3-Coloring Proof"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Chvátal's Art Gallery Theorem (1975)
    via Steve Fisk's elegant 1978 3-coloring proof on triangulated polygon graphs. Proves that for
    any 3-colorable planar triangulation graph on n vertices, there exists a guard set of size
    at most floor(n / 3) covering all facial triangles (3-cliques), verified absent from core Mathlib
Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["05C15", "05C10", "52C99"]

sources:
  - title: "A combinatorial theorem in plane geometry"
    type: paper
    authors:
      - "Václav Chvátal"
    relationship: formalizes
  - title: "A short proof of Chvátal's watchman theorem"
    type: paper
    authors:
      - "Steve Fisk"
    relationship: adapts
  - title: "Art Gallery Theorems and Algorithms"
    type: book
    authors:
      - "Joseph O'Rourke"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
