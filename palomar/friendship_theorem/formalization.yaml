version: "v0.4"

project:
  name: "The Friendship Theorem on Graphs with Unique Common Neighbors"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Friendship Theorem (P. Erdős,
    A. Rényi, and V. T. Sós, 1966; H. S. Wilf, 1971). Proves that any finite simple graph on
    at least three vertices (|V| ≥ 3) in which every pair of distinct vertices shares exactly
    one common neighbor must contain a universal vertex (the 'politician'), structuring the
    graph as a collection of triangles sharing a central vertex (a windmill graph).
    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C50", "05C75", "05E30"]

sources:
  - title: "On a problem of graph theory"
    type: paper
    authors:
      - "P. Erdős"
      - "A. Rényi"
      - "V. T. Sós"
    relationship: formalizes
  - title: "The friendship theorem"
    type: paper
    authors:
      - "H. S. Wilf"
    relationship: adapts
    note: >-
      Formalization adapts Wilf's algebraic spectral and eigenvalue multiplicity argument to prove the
      existence of a universal friend vertex.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
