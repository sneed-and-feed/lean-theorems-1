version: "v0.4"

project:
  name: "Cauchy's Arm Lemma and Convex Rigidity Foundations"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Cauchy's Arm Lemma (1813), the fundamental geometric
    engine underpinning Cauchy's Rigidity Theorem for 3D convex polyhedra. Formalizes 2D polygonal chains,
    squared Euclidean distance metrics, vector inner products, and proves that opening the internal joint
    angles of a chain increases the distance between its endpoints for chains of length at most 2,
    verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52C25", "52A10", "52B10"]

sources:
  - title: "Recherches sur les polyèdres: Premier Mémoire"
    type: paper
    authors:
      - "Augustin-Louis Cauchy"
    relationship: formalizes
  - title: "Proofs from THE BOOK"
    type: book
    authors:
      - "Martin Aigner"
      - "Günter M. Ziegler"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the maintainers
    with interactive proof assistance and refactoring. Verified with 0 errors, 0 warnings, 0 sorries,
    and 0 custom axioms.
