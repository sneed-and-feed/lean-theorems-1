version: "v0.4"

project:
  name: "Cauchy's Arm Base Lemma: The Hinge Theorem and Cosine Inequality"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Cauchy's Arm Base Lemma (the Hinge Theorem / Law of Cosines
    base engine for Cauchy's Arm Lemma, 1813). Formalizes planar polygonal chains, squared Euclidean
    distance metrics, vector inner products, and proves that opening the internal joint angle between two
    adjacent segments increases the distance between the endpoints for chains of length at most 2 (the
    2-chain hinge inequality). This establishes the foundational base case and algebraic engine underpinning
    Cauchy's Rigidity Theorem for 3D convex polyhedra. To the maintainers' knowledge, the theorem was not
    found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision
    (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52C25", "52A10", "52B10"]

sources:
  - title: "Recherches sur les polyèdres: Premier Mémoire"
    type: paper
    authors:
      - "Augustin-Louis Cauchy"
    relationship: formalizes
  - title: "Proofs from THE BOOK"
    type: book
    authors:
      - "Martin Aigner"
      - "Günter M. Ziegler"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
