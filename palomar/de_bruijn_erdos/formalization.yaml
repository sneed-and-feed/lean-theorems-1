version: "v0.4"

project:
  name: "The De Bruijn–Erdős Theorem on Incidence Geometry and Near-Pencil Tightness"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of the De Bruijn–Erdős theorem (1948)
    in incidence geometry and pairwise balanced block designs, together with its constructive
    near-pencil tightness proof. Proves that any finite linear space on n ≥ 3 non-collinear
    points determines at least n lines (|P| ≤ |L|), adapting J. H. Conway's metric perturbation
    double-counting proof. Furthermore, explicitly constructs the near-pencil configuration
    (consisting of one line of n - 1 points and n - 1 lines of 2 points) and proves that it
    forms a valid linear space achieving exact equality |L| = |P|.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["05B25", "51E10", "51A15"]

sources:
  - title: "On a combinatorial problem"
    type: paper
    authors:
      - "N. G. de Bruijn"
      - "Paul Erdős"
    relationship: formalizes

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Data/Finset/Card.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's finite set combinatorics and double-counting sum infrastructure
      to establish linear space axioms, point-line incidences, Conway's metric perturbation inequality,
      and near-pencil tightness.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
