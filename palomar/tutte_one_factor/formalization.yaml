version: "v0.4"

project:
  name: "Tutte's 1-Factor Theorem and Tutte–Berge Defect Duality for Simple Graphs"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Tutte's 1-Factor Theorem (1947)
    and Tutte–Berge defect duality in finite simple graphs. Proves the fundamental characterization
    that a finite simple graph G has a 1-factor (perfect matching) if and only if for every vertex subset U,
    the number of odd components q(G \ U) is at most |U|. While Mathlib provides the core SimpleGraph.tutte
    theorem via IsTutteViolator, this formalization builds the complete structural theory: the idiomatic
    1-factor predicate HasOneFactor, the odd connected component counter q(G \ U), the Tutte–Berge
    matching defect min-max formula, characterization via maximum matching size nu(G) = |V| / 2, and the
    derivation of Hall's Marriage Theorem condition from Tutte's condition in bipartite graphs.
    To the maintainers' knowledge, the 1-factor and Tutte-Berge defect API formulation was not found in an exact
    declaration name search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C70", "05C75"]

sources:
  - title: "The factorization of linear graphs"
    type: paper
    authors:
      - "W. T. Tutte"
    relationship: formalizes
  - title: "Sur le couplage maximum d'un graphe"
    type: paper
    authors:
      - "C. Berge"
    relationship: adapts
    note: >-
      Formalization adapts Berge's maximum matching and deficiency characterization (Tutte–Berge formula) for
      general simple graphs.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
