version: "v0.4"

project:
  name: "Tutte's 1-Factor Theorem for Simple Graphs"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Tutte's 1-Factor Theorem (1947),
    establishing the fundamental characterization that a finite simple graph has a 1-factor
    (perfect matching) if and only if for every vertex subset U, the number of odd components
    q(G \ U) is at most |U|. Also connects to matching defect and the Tutte–Berge formula.
    To the maintainers' knowledge, Tutte's 1-factor characterization with odd components
    was verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C70", "05C75"]

sources:
  - title: "The factorization of linear graphs"
    type: paper
    authors:
      - "W. T. Tutte"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the
    maintainers with interactive proof assistance and refactoring. Verified with 0 errors,
    0 warnings, 0 sorries, and 0 custom axioms.
