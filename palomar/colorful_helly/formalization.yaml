version: "v0.4"

project:
  name: "Lovász's Colorful Helly Theorem for Convex Sets"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Lovász's Colorful Helly Theorem (1974 / Bárány 1982).
    Proves that for any d + 1 finite families of convex sets in R^d such that every colorful transversal
    has a non-empty intersection, at least one entire family has a non-empty intersection.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52A35", "52A20", "05D15"]

sources:
  - title: "A generalization of Carathéodory's theorem"
    type: paper
    authors:
      - "Imre Bárány"
    relationship: adapts
    note: >-
      Bárány's 1982 Theorem 3.1 is formulated for families of compact convex sets. This formalization adapts
      and extends the theorem to arbitrary (not necessarily compact) convex sets in ℝ^d by extracting a finite
      transversal witness pool W across all colorful choices and applying internal compact convex hull
      replacement K(S) = conv(W ∩ S) ⊆ S.
  - title: "Problem 206"
    type: paper
    authors:
      - "László Lovász"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Analysis/Convex/Basic.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's convex analysis infrastructure (Convex ℝ) to establish
      colorful convex systems, transversal intersections, and family-wide Helly intersections.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
