version: "v0.4"

project:
  name: "Dilworth's Poset Chain Decomposition Theorem and Mirsky's Dual Theorem"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Dilworth's Theorem (Robert P.
    Dilworth, 1950) on chain decompositions of finite posets and Mirsky's Dual Theorem
    (Leon Mirsky, 1971) on antichain covers. Proves that the maximum size of an antichain
    equals the minimum number of chains covering the poset, and dually that the maximum
    length of a chain equals the minimum number of antichains covering the poset.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["06A07", "05A18", "05D15"]

sources:
  - title: "A Decomposition Theorem for Partially Ordered Sets"
    type: paper
    year: 1950
    venue: "Annals of Mathematics"
    authors:
      - "R. P. Dilworth"
    relationship: formalizes
  - title: "A dual of Dilworth's decomposition theorem"
    type: paper
    year: 1971
    venue: "American Mathematical Monthly"
    authors:
      - "Leon Mirsky"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
