version: "v0.4"

project:
  name: "The Graham–Pollak Theorem on Bipartite Partitions of Complete Graphs"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Graham–Pollak theorem (1971)
    and its tightness on complete bipartite partitions of complete graphs. Proves that any
    partition of the edges of the complete graph K_n into m complete bipartite subgraphs
    requires at least n - 1 bipartite graphs (m >= n - 1), adapting Helge Tverberg's 1982
    linear-algebraic quadratic form argument. Also formalizes the canonical star partition
    proving tightness. To the maintainers' knowledge, Graham–Pollak was not previously formalized
To the maintainers' knowledge, the theorem was not found in an exact declaration, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C50", "05C70", "15A03"]

sources:
  - title: "On embedding graphs in squashed cubes"
    type: paper
    authors:
      - "R. L. Graham"
      - "H. O. Pollak"
    relationship: formalizes
  - title: "On the decomposition of K_n into complete bipartite graphs"
    type: paper
    authors:
      - "Helge Tverberg"
    relationship: adapts

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.