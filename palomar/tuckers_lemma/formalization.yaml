version: "v0.4"

project:
  name: "Tucker's Combinatorial Lemma & Discrete Borsuk–Ulam Theorem"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Tucker's Combinatorial Lemma (Albert W. Tucker, 1945),
    the discrete foundational precursor to the Borsuk–Ulam Theorem in algebraic topology.
    Formalizes discrete 1D sign changes, symmetric triangulations with antipodal involutions,
    complementary edge predicates, and parity conservation theorems, verified absent from core Mathlib
    (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.AT]
  msc2020: ["05E45", "55M20", "57M15"]

sources:
  - title: "Some topological properties of disk and sphere"
    type: paper
    authors:
      - "Albert W. Tucker"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the maintainers
    with interactive proof assistance and refactoring. Verified with 0 errors, 0 warnings, 0 sorries,
    and 0 custom axioms.
