version: "v0.4"

project:
  name: "Tucker's Lemma: Full Combinatorial & Topological Parity Suite in 1D and 2D"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Tucker's Lemma (Albert W. Tucker, 1945)
    and the combinatorial Borsuk–Ulam theorem in 1D and 2D without artificial conditions. Formalizes
    four foundational pillars: (1) 1D discrete sign-change parity and antipodal interval subdivision lemma;
    (2) 2D combinatorial double counting of face doors and modulo-2 parity conservation on edge-pseudomanifolds;
    (3) the boundary cycle engine on antipodally symmetric disk triangulations proving that non-complementary
    boundary labelings have odd boundary door parity, thereby establishing the full, unconditional 2D Tucker's Lemma;
    and (4) the concrete 6-vertex, 8-face, 12-edge octahedral 2-sphere S^2_8 triangulation.
    All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

classification:
  arxiv: [math.CO, math.AT]
  msc2020: ["05C10", "55M20", "57M15"]

sources:
  - title: "Some topological properties of disk and sphere"
    type: paper
    year: 1945
    venue: "Proceedings of the First Canadian Mathematical Congress, Montreal"
    authors:
      - "Albert W. Tucker"
    relationship: formalizes
    note: >-
      Formalizes Tucker's 1945 combinatorial lemma for 1D antipodal paths and 2D triangulated disks
      and spheres, establishing complementary edge existence under antipodal sign labelings.
  - title: "A generalization of Tucker's combinatorial lemma with topological applications"
    type: paper
    year: 1952
    venue: "Annals of Mathematics"
    authors:
      - "Ky Fan"
    relationship: adapts
    note: >-
      Adapts Ky Fan's multidimensional antipodal labeling perspective to discrete combinatorial triangulations
      and concrete octahedral spheres.
  - title: "A constructive proof of Tucker's combinatorial lemma for primitive sets"
    type: paper
    year: 1981
    venue: "Mathematics of Operations Research"
    authors:
      - "Robert M. Freund"
      - "Michael J. Todd"
    relationship: adapts
    note: >-
      Formalizes Freund and Todd's door-counting double-counting identity and local triangular face
      parity invariant on 2D edge-pseudomanifolds.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified with 100% AST parity.
    Human review verified mathematical statements, carrier fidelity, absence of custom axioms,
    and clean sequential Lean 4 builds.
