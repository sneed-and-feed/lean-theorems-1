version: "v0.4"

project:
  name: "Desargues's Theorem and Synthetic Projective Equivalence"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Desargues's theorem and its converse
    in synthetic axiomatic projective planes. Formalizes Hilbert-style incidence axioms for
    projective planes, establishes that centrally perspective triangles induce a proper axial
    perspective where the axis is distinct from all triangle sides, and formalizes the non-trivial
    converse theorem showing that proper axial perspectivity with distinct corresponding vertices
    implies central perspectivity. Unifies these results into an exact bidirectional equivalence
    between central and proper axial perspectives in Desarguesian projective planes. Verified
Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.AG, math.MG]
  msc2020: ["51A05", "51A30", "14N05"]

sources:
  - title: "Grundlagen der Geometrie"
    type: book
    authors:
      - "David Hilbert"
    relationship: adapts
  - title: "Manière universelle de Mr Desargues, pour pratiquer la perspective par petit-pied, comme le géométral"
    type: book
    authors:
      - "Girard Desargues"
      - "Abraham Bosse"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
