    year: 1966
    venue: "Journal of the London Mathematical Society"
    authors:
      - "Helge Tverberg"
    relationship: formalizes
  - title: "Tverberg's theorem via number of roots of polynomial systems"
    type: paper
    year: 1992
    venue: "Israel Journal of Mathematics"
    authors:
      - "Karanbir S. Sarkaria"
    relationship: formalizes
  - title: "A generalization of Carathéodory's theorem"
