version: "v0.4"

project:
  name: "Tverberg's Partition Theorem, 1D Theorem, and Colorful 1D Theorem"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Tverberg's Theorem (Helge Tverberg,
    1966) for r <= 2 across all dimensions, the full 1D Tverberg theorem for arbitrary r via
    symmetric-rank pairing following Mulzer–Werner, and the 1-dimensional Colorful Tverberg
    Theorem for arbitrary r (Bárány–Larman–Pach 1992). Proves that any (r - 1)(d + 1) + 1 points
    in ℝ^d can be partitioned into r parts whose convex hulls intersect, and that two disjoint
    color classes of r points each in ℝ¹ can be partitioned into r colorful pairs whose convex
    hulls share a common point of intersection. To the maintainers' knowledge, the theorem was not
    found in an exact declaration name, docstring, and type signature search of the pinned Mathlib
    revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52A35", "52C10", "52A20"]

sources:
  - title: "A generalization of Radon's theorem"
    type: paper
    authors:
      - "Helge Tverberg"
    relationship: formalizes
  - title: "Approximating Tverberg points in linear time for any fixed dimension"
    type: paper
    authors:
      - "Wolfgang Mulzer"
      - "Daniel Werner"
    relationship: adapts
    note: >-
      Formalization adapts Mulzer and Werner's geometric transversal and partition framework for discrete
      Tverberg point approximations.
  - title: "Radon-partition property in topological affine spaces"
    type: paper
    authors:
      - "Imre Bárány"
      - "David G. Larman"
      - "János Pach"
    relationship: formalizes

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Analysis/Convex/Hull.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's convex geometry library (convexHull, affine independence, affine combinations)
      and extends it with constructive Tverberg partitions, Radon point reductions, and the 1D symmetric-rank pairing theorem.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
