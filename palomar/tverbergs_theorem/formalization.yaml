version: "v0.4"

project:
  name: "Tverberg's Partition Theorem, 1D Theorem, and Colorful 1D Theorem"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Tverberg's Theorem (Helge Tverberg,
    1966) for all r >= 1 across all dimensions d >= 0 via the Sarkaria–Bárány Colorful Carathéodory
    reduction, the full 1D Tverberg theorem for arbitrary r via symmetric-rank pairing following
    Mulzer–Werner, and the 1-dimensional Colorful Tverberg Theorem for arbitrary r (Bárány–Larman–Pach
    1992). Proves that any (r - 1)(d + 1) + 1 points in ℝ^d can be partitioned into r parts whose
    convex hulls intersect, and that two disjoint color classes of r points each in ℝ¹ can be
    partitioned into r colorful pairs whose convex hulls share a common point of intersection.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring,
    and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52A35", "52C10", "52A20"]

sources:
