version: "v0.4"

project:
  name: "Schur's Theorem in Additive Combinatorics and Group Theory"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Schur's Theorem on sum-free partitions (Issai Schur, 1916),
    the multicolor triangle Ramsey theorem on complete graphs, and their structural generalizations to arbitrary
    multiplicative groups and additive abelian groups. Proves that for every r >= 1, every symmetric edge-coloring
    of a complete graph with at least ramseyTriangleBound r vertices contains a monochromatic triangle, every r-coloring
    of {1, ..., ramseyTriangleBound r} contains a monochromatic solution to x + y = z, and for any finite subset S ⊆ G
    with |S| >= ramseyTriangleBound r, every r-coloring of the quotient set S⁻¹S (or of G) contains a non-identity monochromatic
    solution to x * y = z with x, y, z ∈ (S⁻¹S) \ {1} generated by distinct u, v, w ∈ S (and analogously x, y, z ∈ (S - S) \ {0}
    in additive abelian groups). For any finite group G of order |G| >= ramseyTriangleBound r, the monochromatic solution
    lies directly in G \ {1} (or G \ {0}).
    Explicitly distinguishes the recursive upper bound B_r = ramseyTriangleBound r from exact canonical Ramsey numbers
    R_r(3) and Schur numbers S(r).
    To the maintainers' knowledge, these theorems were not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

