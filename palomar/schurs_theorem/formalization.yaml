version: "v0.4"

project:
  name: "Schur's Theorem on Sum-Free Partitions and Multicolor Triangle Ramsey"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Schur's Theorem on sum-free partitions
    of integers (Issai Schur, 1916) and the Multicolor Triangle Ramsey Theorem. Proves that any
    r-coloring of the integers {1, ..., N} contains a monochromatic solution to x + y = z for
    Scope limitations: The formalizations focus strictly on the core theorems and may not encompass all side corollaries. To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.NT]
  msc2020: ["05D10", "11B75", "05C55"]

sources:
  - title: "Über die Kongruenz x^m + y^m ≡ z^m (mod p)"
    type: paper
    year: 1916
    venue: "Jahresbericht der Deutschen Mathematiker-Vereinigung"
    authors:
      - "Issai Schur"
    relationship: formalizes
  - title: "On a Problem in Formal Logic"
    type: paper
    authors:
      - "Frank P. Ramsey"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
