version: "v0.4"

project:
  name: "Schur's Theorem: Algebraic, Quantitative & Linear Systems Suite"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A comprehensive, machine-checked Lean 4 formalization of Schur's Theorem on sum-free partitions
    (Issai Schur, 1916), its algebraic generalizations to general groups and additive abelian groups,
    quantitative counting bounds (exact (N - 1) * N / 2 count for r = 1 and the disjoint-block double-counting
    bound k <= N * |monoSchurTriples χ N| whenever N >= k * B_r), and single-equation Rado partition regularity (Richard Rado, 1933).
    Proves that for any finite subset S ⊆ G (or finite group G) with cardinality |S| >= ramseyTriangleBound r = B_r,
    every r-coloring contains monochromatic solutions to x * y = z and x + y = z with authentic non-identity / non-zero
    witnesses (x, y, z ≠ 1 or x, y, z ≠ 0). Formalizes the constant-solution zero-sum corollary (∑ c_i = 0) and the Schur instance
    (1, 1, -1) of Rado's theorem over ℕ+. Explicitly distinguishes the recursive upper bound B_r = ramseyTriangleBound r
    from exact canonical Ramsey numbers R_r(3) and Schur numbers S(r).
    To the maintainers' knowledge, these theorems were not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

