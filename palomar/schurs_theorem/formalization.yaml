      Formalization builds on Mathlib's finite set cardinality, finset pigeonhole, group theory,
      and big operators infrastructure to establish algebraic Schur, supersaturation, and Rado partition regularity.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified with 100% AST parity. Solution verified through
    maintainer audit with 0 errors, 0 sorries, and strictly standard kernel axioms. Adapts Rado (1933) by formalizing the
    constant-solution zero-sum case and the Schur instance (1, 1, -1).
