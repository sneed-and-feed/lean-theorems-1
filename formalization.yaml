version: "v0.4"

project:
  name: "Descartes's Rule of Signs"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Descartes's Rule of Signs (1637, Wiedijk #73).
    Proves that for any non-zero real polynomial p(X), the number of positive real roots counted
    with algebraic multiplicity is bounded above by the number of sign variations in its coefficients
    and has the same parity. Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.AG, math.CA]
  msc2020: ["12D10", "26C10", "30C15"]

sources:
  - title: "La Géométrie"
    type: book
    authors:
      - "René Descartes"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the maintainers
    with interactive proof assistance and refactoring. Verified with 0 errors, 0 warnings, 0 sorries,
    and 0 custom axioms.
