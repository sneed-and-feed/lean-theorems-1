version: "v0.4"

project:
  name: "Radon's Lemma and Helly's Theorem on Convex Sets"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of Radon's Lemma (Johann Radon, 1921)
    and Helly's Theorem on intersecting families of convex sets (Eduard Helly, 1923; Freek
    Wiedijk #99) from first principles. Proves that any d + 2 points in ℝ^d admit a Radon
    partition, and uses Radon's lemma by induction to prove Helly's theorem for finite families of convex sets.

    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
        docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).
classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52A35", "52A20", "52C10"]

sources:
  - title: "Mengen konvexer Körper, die einen gemeinsamen Punkt enthalten"
    type: paper
    authors:
      - "Johann Radon"
    relationship: formalizes
  - title: "Über Mengen konvexer Körper mit gemeinschaftlichen Punkten"
    type: paper
    authors:
      - "Eduard Helly"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
