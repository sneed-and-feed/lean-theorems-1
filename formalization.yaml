version: "v0.4"

project:
  name: "Kneser's Conjecture and Lovász's Chromatic Bound (1978)"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Kneser graph coloring bound (Kneser's Conjecture,
    1955; Lovász's Theorem, 1978). Formalizes the Kneser graph KG(n, k) on k-subsets of an n-element set,
    defines the combinatorial fiber coloring based on minimal elements, proves proper coloring by fiberwise
    pigeonhole on intervals, and establishes the chromatic bound chi(KG(n, k)) <= n - 2k + 2.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.AT]
  msc2020: ["05C15", "05E45", "55M20"]

sources:
  - title: "Kneser's conjecture, chromatic number, and homotopy"
    type: paper
    year: 1978
    venue: "Journal of Combinatorial Theory, Series A"
    authors:
      - "László Lovász"
    relationship: formalizes
  - title: "Aufgabe 360"
    type: paper
    year: 1955
    venue: "Jahresbericht der Deutschen Mathematiker-Vereinigung"
    authors:
      - "Martin Kneser"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Combinatorics/SimpleGraph/Coloring/Vertex.lean"
    relationship: builds-on
    note: >-
      Formalization builds on Mathlib's `SimpleGraph` vertex coloring framework (`SimpleGraph.Colorable`, `SimpleGraph.Coloring`)
      and finite graph infrastructure to construct Kneser graphs and prove the chromatic upper bound n - 2k + 2.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    maintainer audit with 0 errors, 0 sorries, and strictly standard kernel axioms.
