version: "v0.4"

project:
  name: "Ore's and Dirac's Theorems on Hamiltonian Cycles"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Ore's theorem (1960) and Dirac's theorem (1952)
    on the existence of Hamiltonian cycles in simple graphs. Proves Ore's degree-sum condition via maximal
    path cycle-closure and connectivity arguments, and derives Dirac's minimum-degree theorem as a corollary.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C38", "05C45"]

sources:
  - title: "Note on Hamilton circuits"
    type: paper
    year: 1960
    venue: "American Mathematical Monthly"
    authors:
      - "Øystein Ore"
    relationship: formalizes
  - title: "Some theorems on abstract graphs"
    type: paper
    year: 1952
    venue: "Proceedings of the London Mathematical Society"
    authors:
      - "G. A. Dirac"
    relationship: adapts

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.