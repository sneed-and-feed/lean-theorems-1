version: "v0.4"

project:
  name: "Euler's Polyhedron Formula"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Euler's Polyhedron Formula V - E + F = 2
    (1758, Wiedijk #13) and fundamental topological planar graph bounds using Cauchy's 1813
    inductive planar map reduction (Recherches sur les polyedres). Proves the Euler characteristic
    identity chi(M) = 2 by structural induction over planar network operations (base polygon,
    single vertex, pendant leaf addition, and face-splitting chords). Formally derives the classical
    planar edge bounds E <= 3V - 6 and E <= 2V - 4 (triangle-free), average vertex degree bound
    2E < 6V, and complete non-planarity proofs establishing the non-existence of planar map embeddings
    for K5 and K3,3.

    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).
classification:
  arxiv: [math.CO, math.GT]
  msc2020: ["05C10", "57M15", "52B05"]

sources:
  - title: "Elementa doctrinae solidorum"
    type: paper
    authors:
      - "Leonhard Euler"
    relationship: inspired_by
  - title: "Recherches sur les polyedres"
    type: paper
    authors:
      - "A.-L. Cauchy"
    relationship: formalizes

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.