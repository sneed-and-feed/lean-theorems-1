version: "v0.4"

project:
  name: "Lovász's Colorful Helly Theorem for Convex Sets"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Lovász's Colorful Helly Theorem (1974 / Bárány 1982).
    Proves that for any d + 1 finite families of convex sets in R^d such that every colorful transversal
    has a non-empty intersection, at least one entire family has a non-empty intersection.
    To the maintainers' knowledge, the Colorful Helly theorem was verified absent from core
    Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52A35", "52A20", "05D15"]

sources:
  - title: "A generalization of Carathéodory's theorem"
    type: paper
    authors:
      - "Imre Bárány"
    relationship: formalizes
  - title: "Problem 206"
    type: paper
    authors:
      - "László Lovász"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the
    maintainers with interactive proof assistance and refactoring. Verified with 0 errors,
    0 warnings, 0 sorries, and 0 custom axioms.
