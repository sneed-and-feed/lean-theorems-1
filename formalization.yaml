version: "v0.4"

project:
  name: "Euler's Polyhedron Formula"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of Euler's Polyhedron Formula V - E + F = 2
    (1758, Wiedijk #13) and fundamental topological graph theory bounds using Tutte-Edmonds
    combinatorial maps (dart rotation systems). Formalizes connected planar combinatorial maps
    (requiring reachability connectedness and Euler characteristic 2), concrete polyhedral instances
    (including the regular tetrahedron map on 12 darts), classical planar edge bounds E <= 3V - 6
    and E <= 2V - 4 directly on combinatorial map structures, and complete non-planarity proofs
    demonstrating the non-existence of planar combinatorial map embeddings for K5 and K3,3.

    To the maintainers' knowledge, the theorem was not found in an exact declaration name,
    docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).
classification:
  arxiv: [math.CO, math.GT]
  msc2020: ["05C10", "57M15", "52B05"]

sources:
  - title: "Elementa doctrinae solidorum"
    type: paper
    authors:
      - "Leonhard Euler"
    relationship: inspired_by
  - title: "A Combinatorial Approach to Embeddings and Maps"
    type: paper
    authors:
      - "W. T. Tutte"
      - "Jack Edmonds"
    relationship: adapts
  - title: "Recherches sur les polyèdres"
    type: paper
    authors:
      - "A.-L. Cauchy"
    relationship: inspired_by

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.