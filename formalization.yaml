version: "v0.4"

project:
  name: "The Graham–Pollak Theorem on Bipartite Partitions of Complete Graphs"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Graham–Pollak theorem (1971)
    and its tightness on complete bipartite partitions of complete graphs. Proves that any
    partition of the edges of the complete graph K_n into m complete bipartite subgraphs
    requires at least n - 1 bipartite graphs (m >= n - 1), using Tverberg's 1982 algebraic
    and linear-algebraic reduction on quadratic forms. Also formalizes the canonical star
    partition proving tightness.

classification:
  arxiv: [math.CO]
  msc2020: ["05C50", "05C70", "15A03"]

sources:
  - title: "On embedding graphs in squashed cubes"
    type: paper
    authors:
      - "R. L. Graham"
      - "H. O. Pollak"
    relationship: formalizes
  - title: "A technique for proving that a graph does not have certain properties"
    type: paper
    authors:
      - "H. Tverberg"
    relationship: adapts

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction and human verification.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: agent-reviewed
  reviewers:
    - "sneed-and-feed maintainers"
    - "Interactive Lean LSP and kernel verification"
  notes: >-
    The formalization has undergone proof golfing, eliminating redundant steps and lemmas,
    and verified through Lean 4 and Mathlib with 0 errors, 0 warnings, 0 sorries, and 0 custom axioms.