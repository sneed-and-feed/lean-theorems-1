version: "v0.4"

project:
  name: "Desargues's Theorem in Vector and Axiomatic Projective Geometry"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of Desargues's theorem (Wiedijk #53) in both
    module-theoretic vector geometry and synthetic axiomatic projective planes. Proves that centrally
    perspective triangles have collinear side-intersection points in modules over commutative rings,
    and proves the non-trivial converse theorem in Desarguesian projective planes under proper nondegeneracy
    hypotheses. Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.AG, math.MG]
  msc2020: ["51A05", "51A30", "14N05"]

sources:
  - title: "Manière universelle de Mr. Girard Desargues, pour pratiquer la perspective par petit-pied, comme le geometral"
    type: book
    authors:
      - "Girard Desargues"
      - "Abraham Bosse"
    relationship: formalizes
  - title: "Grundlagen der Geometrie"
    type: book
    authors:
      - "David Hilbert"
    relationship: background

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely strictly
        on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    The formalization and Challenge/Solution parity were verified through human audit by the maintainers
    with interactive proof assistance and refactoring. Verified with 0 errors, 0 warnings, 0 sorries,
    and 0 custom axioms.
