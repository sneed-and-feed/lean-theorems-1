version: "v0.4"

project:
  name: "The Crossing Lemma and Székely's Probabilistic Amplification"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of the Crossing Lemma (Ajtai, Chvátal, Newborn, Szemerédi 1982;
        Leighton 1983) and its application to the Szemerédi–Trotter point-line incidence theorem via László Székely's
        probabilistic expectation sub-sampling amplification (1997). Proves that any planar drawing of a graph with
        e >= 4v edges has at least e^3 / 64v^2 crossings.
        Scope limitations: The formalizations focus strictly on the core theorems and may not encompass all side corollaries. To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.MG]
  msc2020: ["05C10", "05C62", "52C10"]

sources:
  - title: "Crossing-free subgraphs"
    type: paper
    authors:
      - "Miklós Ajtai"
      - "Vašek Chvátal"
      - "Monty M. Newborn"
      - "Endre Szemerédi"
    relationship: formalizes
  - title: "Crossing numbers and hard Erdős problems in discrete geometry"
    type: paper
    authors:
      - "László A. Székely"
    relationship: adapts

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
