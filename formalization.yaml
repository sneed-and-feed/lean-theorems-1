    author: "R. L. Graham and H. O. Pollak"
    year: 1971
    venue: "Bell System Technical Journal 50 (8), 2495–2519"
  - title: "A technique for proving that a graph does not have certain properties"
    author: "H. Tverberg"
    year: 1982
    venue: "Pacific Journal of Mathematics 100 (1), 225–233"

