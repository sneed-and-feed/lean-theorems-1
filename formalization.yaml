schema_version: "0.4"
project:
  title: "The Graham–Pollak Theorem on Bipartite Partitions of Complete Graphs"
  description: "A complete, machine-checked Lean 4 formalization of the Graham–Pollak theorem (1971) and its tightness on complete bipartite partitions of complete graphs. Proves that any partition of the edges of the complete graph K_n into complete bipartite subgraphs requires at least n - 1 bipartite graphs (m >= n - 1), using Tverberg's 1982 algebraic and linear-algebraic reduction on quadratic forms. Also formalizes the canonical star partition proving tightness."
  license: "CC0-1.0"
  authors:
    - name: "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - name: "sneed-and-feed"
      github: "sneed-and-feed"

classification:
  msc2020:
    - "05C50"
    - "05C70"
    - "15A03"
  arxiv:
    - "math.CO"

sources:
