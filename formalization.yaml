version: "v0.4"

project:
  name: "General n-Dimensional Sperner's Lemma and Fixed-Point Combinatorics"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A machine-checked Lean 4 formalization of the general n-dimensional combinatorial Sperner parity theorem
    on abstract n-dimensional pseudomanifolds with boundary for arbitrary dimension n : ℕ. Proves the local
    door-counting parity invariant on (n+1)-simplices, the global double-counting identity on door-facet
    incidences, and the master parity congruence modulo 2 relating panchromatic (n+1)-simplices to boundary
    doors. The theorem is conditional on an odd number of boundary (n-1)-doors; obtaining the classical
    geometric Sperner lemma for simplicial subdivisions of geometric simplices with boundary-preserving colorings
    is a specialization requiring an additional geometric boundary induction argument not contained in these
    abstract combinatorial declarations. To the maintainers' knowledge, the theorem was not found in an exact
    declaration name, docstring, and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.AT]
  msc2020: ["05E45", "57Q05", "52A35", "55M20"]

sources:
  - title: "Neuer Beweis für die Invarianz der Dimensionszahl und des Gebietes"
    type: paper
    authors:
      - "Emanuel Sperner"
    year: 1928
    venue: "Abhandlungen aus dem Mathematischen Seminar der Universität Hamburg"
    volume: "6"
    issue: "1"
    pages: "265-272"
    relationship: adapts
    notes: >-
      Adapts Emanuel Sperner's classical combinatorial parity argument to abstract finite n-dimensional
      pseudomanifolds with boundary (PseudomanifoldND α n) for arbitrary n : ℕ. Formalizes the general
      combinatorial double-counting relation while omitting the geometric boundary-coloring induction step
      for geometric simplices.
  - title: "Simplicial Approximation of Fixed Points"
    type: paper
    authors:
      - "Harold W. Kuhn"
    year: 1968
    venue: "Proceedings of the National Academy of Sciences"
    volume: "61"
    issue: "4"
    pages: "1238-1242"
    relationship: adapts
    notes: >-
      Adapts Kuhn's combinatorial door-labeling framework for simplicial fixed-point algorithms to abstract
      (n+1)-uniform hypergraph complexes.

related_formalizations:
  - path: "Formalization/SpernersLemma.lean"
    relationship: generalizes
    notes: >-
      Generalizes the fixed 2D edge-pseudomanifold parity theorem to arbitrary dimension n : ℕ. The 1D path
      switching formalization remains an independent discrete model.
  - path: "Formalization/Sperner3D.lean"
    relationship: supersedes
    notes: >-
      Supersedes the 3D tetrahedral face-pseudomanifold parity identities by subsuming them into the unified
      parameterized n-dimensional pseudomanifold architecture (PseudomanifoldND α 3).

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.