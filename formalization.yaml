version: "v0.4"

project:
  name: "The Sylvester–Gallai Theorem on Ordinary Lines in the Euclidean Plane"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete, machine-checked Lean 4 formalization of the Sylvester–Gallai theorem (J. J.
    Sylvester 1893, T. Gallai 1944, L. M. Kelly 1948; Freek Wiedijk #98). Proves that every
    finite non-collinear set of points in the real Euclidean plane contains an ordinary line
    passing through exactly two points of the set, formalized via Kelly's minimal point-line
    distance variational proof. Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).

    Verified absent from core Mathlib (checked against Mathlib v4.34.0-rc1).
classification:
  arxiv: [math.MG, math.CO]
  msc2020: ["52C10", "52C35", "51M04"]

sources:
  - title: "Mathematical Question 11851"
    type: paper
    authors:
      - "J. J. Sylvester"
    relationship: formalizes
  - title: "Solution to Problem 4065"
    type: paper
    authors:
      - "Tibor Gallai"
    relationship: formalizes
  - title: "A problem of collinear points"
    type: paper
    authors:
      - "H. S. M. Coxeter"
      - "L. M. Kelly"
    relationship: adapts

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with automated proof golfing and interactive
        Lean LSP checking with Gemini models under maintainer direction. All declarations rely
        strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate statement holes. Solution verified through human audit by the
    maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
